  <div id="splash" class="splash" role="status" aria-live="polite">
    <div class="splash-inner">
      <div class="splash-mark">
        <img src="icons/icon-192.png" width="104" height="104" alt="">

      <p id="splash-sub" class="splash-sub">光影留印，時光有跡</p>
      <span class="splash-bar" aria-hidden="true"><span></span></span>
    </div>
  </div>
  <script>
    (function () {
      // 在主程式載入前就決定語言，與 i18n.js 的判斷方式一致
      var lang = null;
      try { lang = localStorage.getItem('lumark.lang'); } catch (e) {}
      if (!lang) {
        var prefs = navigator.languages || [navigator.language];
        for (var i = 0; i < prefs.length && !lang; i++) {
          var p = String(prefs[i] || '').toLowerCase();
          lang = p.indexOf('zh') === 0 ? 'zh-Hant' : p.indexOf('ja') === 0 ? 'ja' : p.indexOf('en') === 0 ? 'en' : null;
        }
      }
      var text = {
        'zh-Hant': ['光印', '光影留印，時光有跡'],
        en: ['Lumark', 'Light leaves a mark, time leaves a trace'],
        ja: ['光印', '光は跡を、時は記憶を']
      }[lang || 'en'] || ['Lumark', 'Light leaves a mark, time leaves a trace'];
      document.getElementById('splash-name').textContent = text[0];
      document.getElementById('splash-sub').textContent = text[1];

      var splash = document.getElementById('splash');
      var start = Date.now();
      var done = false;
      function hide() {
        if (done) return;
        done = true;
        var wait = Math.max(0, 1300 - (Date.now() - start)); // 至少顯示 1.3 秒，讓動畫播完
        setTimeout(function () {
          splash.classList.add('splash-out');
          setTimeout(function () { splash.remove(); }, 600);
        }, wait);
      }
      window.addEventListener('load', hide);
      setTimeout(hide, 5000); // 網路很慢時也不要一直擋住畫面
    })();
  </script>
